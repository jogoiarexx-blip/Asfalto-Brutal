name: Asfalto Brutal motorcycle WebGL integration
on:
  push:
    branches: [main, feat/campaign-chapter2-deliveries-v210, qa/branch-impact-20261031]
  workflow_dispatch:
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for isolated browser render test
        run: |
          npm install --no-save playwright three@0.186.1
          npx playwright install --with-deps chromium
      - name: Test logic and integration
        run: |
          npm test
          node --check js/game.js
          node --check js/world.js
          node tests/browser-render.test.mjs
          node tests/jailbreak-browser.test.mjs
          node tests/road-forks-browser.test.mjs
          node tests/npc-forks-browser.test.mjs
          node tests/chapter2-browser.test.mjs
          node tests/branch-impact-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motorcycle-webgl-screenshot
          path: |
            tests/browser-render.png
            tests/road-fork-render.png
            tests/npc-fork-render.png
            tests/chapter2-render.png
          if-no-files-found: ignore
